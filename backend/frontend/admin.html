<main class="page admin-page">
<!-- Səhifənin əsas məzmun hissəsi -->

  <div class="container">

    <!-- Header -->
    <div class="admin-header">
    <!-- Admin panelinin yuxarı başlıq hissəsi -->
      <div class="admin-icon">⚙️</div>
      <!-- Vizual olaraq dişli çarx ikonu -->
      <div>
        <div class="admin-title">Admin Panel</div>
        <!-- Böyük başlıq mətni -->
        <div class="admin-sub">Manage professors, subjects, and assignments</div>
        <!-- Başlığın altındakı kiçik izah mətni -->
      </div>
    </div>

    <div class="admin-grid">
    <!-- Üç paneli yan-yana göstərən grid (şəbəkə) düzümü -->

      <!-- ADD PROFESSOR -->
      <div class="admin-panel">
      <!-- Professor əlavə etmək üçün sol panel -->

        <div class="admin-panel-head">
          <div class="dot dot-gold"></div>
          <!-- Qızılı rəngli kiçik nöqtə — vizual işarə -->
          Add Professor
        </div>

        <div class="admin-panel-body">

          <div class="form-row">
            <label class="form-label">Full Name *</label>
            <!-- "Full Name" yazısı — ulduz (*) mütləq doldurulmalı olduğunu bildirir -->
            <input class="form-input" id="p-name" placeholder="Dr. Jane Smith" />
            <!-- Professorun adını yazmaq üçün input sahəsi -->
          </div>

          <div class="form-row">
            <label class="form-label">University *</label>
            <input class="form-input" id="p-university" placeholder="University of Bologna" />
            <!-- Professorun işlədiyi universiteti yazmaq üçün sahə -->
          </div>

          <div class="form-row">
            <label class="form-label">Faculty *</label>
            <input class="form-input" id="p-faculty" placeholder="Engineering" />
            <!-- Professorun hansı fakültədə olduğunu yazmaq üçün sahə -->
          </div>

          <div class="form-row">
            <label class="form-label">Department *</label>
            <input class="form-input" id="p-department" placeholder="Computer Science" />
            <!-- Professorun kafedrası üçün sahə -->
          </div>

          <div class="form-row">
            <label class="form-label">Biography</label>
            <textarea class="form-input review-input" id="p-bio" placeholder="Short bio…" style="min-height:80px"></textarea>
            <!-- Haqqında qısa məlumat yazmaq üçün çox sətirli mətn sahəsi -->
          </div>

          <button class="admin-submit" onclick="addProfessor()">Add Professor</button>
          <!-- Bu düyməyə basanda addProfessor() funksiyası işə düşür və professor əlavə olunur -->

          <div class="admin-list">
            <div class="admin-list-title">Professors</div>
            <!-- Mövcud professorların siyahısının başlığı -->
            <div id="prof-list"><div class="loading"><div class="spinner"></div></div></div>
            <!-- Məlumatlar yüklənənə qədər burada fırlanan yükləmə animasiyası görünür -->
          </div>
        </div>
      </div>

      <!-- ADD SUBJECT -->
      <div class="admin-panel">
      <!-- Fənn əlavə etmək üçün orta panel -->

        <div class="admin-panel-head">
          <div class="dot dot-blue"></div>
          <!-- Mavi rəngli kiçik nöqtə -->
          Add Subject
        </div>

        <div class="admin-panel-body">

          <div class="form-row">
            <label class="form-label">Subject Name *</label>
            <input class="form-input" id="s-name" placeholder="Algorithms & Data Structures" />
            <!-- Fənnin adını yazmaq üçün sahə -->
          </div>

          <div class="form-row">
            <label class="form-label">Department *</label>
            <input class="form-input" id="s-department" placeholder="Computer Science" />
            <!-- Fənnin aid olduğu kafedrası -->
          </div>

          <button class="admin-submit" onclick="addSubject()">Add Subject</button>
          <!-- Bu düyməyə basanda addSubject() funksiyası işə düşür və fənn əlavə olunur -->

          <div class="admin-list">
            <div class="admin-list-title">Subjects</div>
            <!-- Mövcud fənnlərin siyahısının başlığı -->
            <div id="sub-list"><div class="loading"><div class="spinner"></div></div></div>
            <!-- Fənnlər yüklənənə qədər fırlanan animasiya göstərilir -->
          </div>
        </div>
      </div>

      <!-- ASSIGN SUBJECT TO PROFESSOR -->
      <div class="admin-panel">
      <!-- Professora fənn təyin etmək üçün sağ panel -->

        <div class="admin-panel-head">
          <div class="dot dot-green"></div>
          <!-- Yaşıl rəngli kiçik nöqtə -->
          Assign Subject to Professor
        </div>

        <div class="admin-panel-body">

          <div class="form-row">
            <label class="form-label">Professor *</label>
            <select class="form-select" id="a-professor">
              <option value="">Select professor…</option>
              <!-- Açılan siyahıdan professor seçilir, seçimlər JavaScript ilə doldurulur -->
            </select>
          </div>

          <div class="form-row">
            <label class="form-label">Subject *</label>
            <select class="form-select" id="a-subject">
              <option value="">Select subject…</option>
              <!-- Açılan siyahıdan fənn seçilir, seçimlər JavaScript ilə doldurulur -->
            </select>
          </div>

          <button class="admin-submit" onclick="assignSubject()">Assign Subject</button>
          <!-- Bu düyməyə basanda assignSubject() işə düşür və fənn professora təyin edilir -->

        </div>
      </div>

    </div>

<script src="js/shared.js"></script>
<!-- Bütün səhifələrdə ortaq istifadə edilən JavaScript funksiyalarını bağlayırıq (api, toast və s.) -->

<script>
let allProfs    = [];
let allSubjects = [];
// Bütün professorları və fənnləri saxlamaq üçün boş massivlər yaradırıq

async function loadData() {
  // Serverdən eyni vaxtda həm professorları, həm də fənnləri yükləyirik
  [allProfs, allSubjects] = await Promise.all([api.getProfessors(), api.getSubjects()]);
  renderProfList();   // Professor siyahısını ekrana çəkirik
  renderSubList();    // Fənn siyahısını ekrana çəkirik
  renderSelects();    // Açılan siyahıları (select) doldururuq
}

function renderProfList() {
  const el = document.getElementById('prof-list');
  // HTML-dəki professor siyahısı elementini tapırıq

  el.innerHTML = allProfs.length
    ? allProfs.map(p => `
        <div class="admin-list-item">
          <div>
            <div class="name">${p.full_name}</div>
            <!-- Professorun tam adı -->
            <div class="meta">${p.department} · ${p.university}</div>
            <!-- Kafedra və universitet məlumatı -->
          </div>
          <button class="delete-btn" onclick="deleteProfessor(${p.id})">Delete</button>
          <!-- Silmə düyməsi — hər professorun yanında ayrıca olur -->
        </div>`).join('')
    : '<div class="text-muted" style="font-size:.85rem;padding:8px 0">No professors yet</div>';
    // Əgər heç professor yoxdursa, bu mətn göstərilir
}

function renderSubList() {
  const el = document.getElementById('sub-list');
  // HTML-dəki fənn siyahısı elementini tapırıq

  el.innerHTML = allSubjects.length
    ? allSubjects.map(s => `
        <div class="admin-list-item">
          <div>
            <div class="name">${s.subject_name}</div>
            <!-- Fənnin adı -->
            <div class="meta">${s.department} · ${s.professor_count} prof${s.professor_count !== 1 ? 's' : ''}</div>
            <!-- Kafedra və neçə professorun bu fənni tədris etdiyi -->
          </div>
          <button class="delete-btn" onclick="deleteSubject(${s.id})">Delete</button>
          <!-- Fənni silmək üçün düymə -->
        </div>`).join('')
    : '<div class="text-muted" style="font-size:.85rem;padding:8px 0">No subjects yet</div>';
    // Əgər heç fənn yoxdursa, bu mətn göstərilir
}

function renderSelects() {
  const ps = document.getElementById('a-professor');
  const ss = document.getElementById('a-subject');
  // "Assign" panelindəki açılan siyahı elementlərini tapırıq

  ps.innerHTML = '<option value="">Select professor…</option>' +
    allProfs.map(p => `<option value="${p.id}">${p.full_name}</option>`).join('');
  // Professor siyahısını açılan menüya əlavə edirik

  ss.innerHTML = '<option value="">Select subject…</option>' +
    allSubjects.map(s => `<option value="${s.id}">${s.subject_name}</option>`).join('');
  // Fənn siyahısını açılan menüya əlavə edirik
}

window.addProfessor = async function() {
  // İstifadəçinin doldurduğu formdakı məlumatları oxuyuruq
  const body = {
    full_name:  document.getElementById('p-name').value.trim(),
    university: document.getElementById('p-university').value.trim(),
    faculty:    document.getElementById('p-faculty').value.trim(),
    department: document.getElementById('p-department').value.trim(),
    biography:  document.getElementById('p-bio').value.trim(),
  };

  if (!body.full_name || !body.university || !body.faculty || !body.department) {
    toast('Please fill all required fields', 'error'); return;
    // Məcburi sahələr boşdursa, xəta mesajı göstəririk və dayandırırıq
  }

  try {
    await api.postProfessor(body);
    // Məlumatları serverə göndəririk
    toast('Professor added!', 'success');
    // Uğurlu olduqda yaşıl bildiriş göstəririk
    ['p-name','p-university','p-faculty','p-department','p-bio'].forEach(id => document.getElementById(id).value = '');
    // Formu təmizləyirik ki, növbəti professor üçün hazır olsun
    await loadData();
    // Siyahını yeniləyirik
  } catch(e) { toast(e.message, 'error'); }
  // Xəta olarsa, xəta mesajını ekranda göstəririk
};

window.addSubject = async function() {
  // İstifadəçinin doldurduğu fənn formu məlumatlarını oxuyuruq
  const body = {
    subject_name: document.getElementById('s-name').value.trim(),
    department:   document.getElementById('s-department').value.trim(),
  };

  if (!body.subject_name || !body.department) {
    toast('Please fill all required fields', 'error'); return;
    // Sahələr boşdursa, xəta göstəririk
  }

  try {
    await api.postSubject(body);
    // Fənni serverə əlavə edirik
    toast('Subject added!', 'success');
    // Uğurlu olduqda bildiriş göstəririk
    ['s-name','s-department'].forEach(id => document.getElementById(id).value = '');
    // Formu sıfırlayırıq
    await loadData();
    // Siyahını yeniləyirik
  } catch(e) { toast(e.message, 'error'); }
};

window.assignSubject = async function() {
  const professor_id = document.getElementById('a-professor').value;
  const subject_id   = document.getElementById('a-subject').value;
  // Seçilmiş professorun və fənnin ID-lərini götürürük

  if (!professor_id || !subject_id) {
    toast('Select both professor and subject', 'error'); return;
    // Hər ikisi seçilməyibsə, xəta göstəririk
  }

  try {
    await api.assignSubject({ professor_id, subject_id });
    // Serverə göndəririk ki, bu fənni həmin professora təyin etsin
    toast('Subject assigned!', 'success');
    // Uğurlu olduqda bildiriş göstəririk
  } catch(e) { toast(e.message, 'error'); }
};

window.deleteProfessor = async function(id) {
  if (!confirm('Delete this professor and all their reviews?')) return;
  // İstifadəçidən təsdiq istəyirik — "əminsiniz?" tipli dialoq

  try {
    await api.deleteProfessor(id);
    // Həmin ID-li professoru serverdən silir
    toast('Professor deleted', 'success');
    await loadData();
    // Siyahını yeniləyirik
  } catch(e) { toast(e.message, 'error'); }
};

window.deleteSubject = async function(id) {
  if (!confirm('Delete this subject?')) return;
  // Fənni silmədən əvvəl istifadəçidən təsdiq alırıq

  try {
    await api.deleteSubject(id);
    // Həmin fənni serverdən silir
    toast('Subject deleted', 'success');
    await loadData();
    // Siyahını yeniləyirik
  } catch(e) { toast(e.message, 'error'); }
};

loadData().catch(e => {
  document.getElementById('prof-list').innerHTML =
    `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">Cannot connect to API</div></div>`;
  // Əgər server ilə əlaqə qurulmazsa, xəta mesajı göstəririk
  document.getElementById('sub-list').innerHTML = '';
  // Fənn siyahısını boş buraxırıq
});
</script>
