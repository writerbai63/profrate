</head>

<body>

  <nav class="nav">
    <a href="index.html" class="nav-logo">
      <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M14 3L2 9l12 6 12-6-12-6z" />
        <path d="M2 9v8" />
        <path d="M7 11.5v6a9 9 0 0014 0v-6" />
      </svg>
      ProfRate
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="search.html">Professors</a>

    </div>
    <div class="nav-search-mini">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.35-4.35" />
      </svg>
      <input id="nav-search-input" type="text" placeholder="Search…" />
    </div>

  </nav>

  <main class="page profile-page">
    <div class="container">

      <div class="breadcrumb">
        <a href="index.html">Home</a>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6" />
        </svg>
        <a href="search.html">Professors</a>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6" />
        </svg>
        <span id="bc-name">Loading…</span>
      </div>

      <div id="profile-loading" class="loading">
        <div class="spinner"></div><span>Loading profile…</span>
      </div>
      <div id="profile-content" class="hidden"></div>

    </div>
  </main>

  <footer>
    <div class="container">
      <p>Built with ❤️ for students · <strong>ProfRate</strong></p>
    </div>
  </footer>

  <script src="js/shared.js"></script>
  <script>
    (async function () {
      const id = new URLSearchParams(location.search).get('id');
      if (!id) { location.href = 'search.html'; return; }

      try {
        const prof = await api.getProfessor(id);
        document.title = `${prof.full_name} — ProfRate`;
        document.getElementById('bc-name').textContent = prof.full_name;

        renderProfile(prof);
      } catch (e) {
        document.getElementById('profile-loading').innerHTML =
          `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">${e.message}</div></div>`;
      }

      function renderProfile(prof) {
        document.getElementById('profile-loading').classList.add('hidden');
        const content = document.getElementById('profile-content');
        content.classList.remove('hidden');

        const avg = Number(prof.avg_rating) || 0;
        const cnt = Number(prof.review_count) || 0;

        const subjectListHTML = (prof.subjects || []).map(s => `
      <div class="subject-list-item" onclick="goToSubject(${s.id})">
        <div>
          <div class="sname">${s.subject_name}</div>
          <div class="sdept">${s.department}</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </div>`).join('');

        const reviewsHTML = renderReviews(prof.reviews || []);

        content.innerHTML = `
      <!-- Hero -->
      <div class="profile-hero">
        <div>
          ${prof.photo_url
            ? `<img src="${prof.photo_url}" style="width:80px;height:80px;border-radius:18px;object-fit:cover;border:1px solid var(--border);margin-bottom:20px" onerror="this.style.display='none'" />`
            : `<div class="profile-avatar">${initials(prof.full_name)}</div>`
          }
          <h1 class="profile-name">${prof.full_name}</h1>
          <div class="profile-meta">
            ${prof.position ? `
<div class="profile-meta-item">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
  ${prof.position}
</div>` : ''}
${prof.academic_degree ? `
<div class="profile-meta-item">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
  ${prof.academic_degree}
</div>` : ''}
${prof.email ? `
<div class="profile-meta-item">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
  <a href="mailto:${prof.email}" style="color:var(--gold)">${prof.email}</a>
</div>` : ''}
            <div class="profile-meta-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
              ${prof.university}
            </div>
            <div class="profile-meta-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="m8 21 4-4 4 4"/></svg>
              ${prof.faculty}
            </div>
            <div class="profile-meta-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
              Added ${fmtDate(prof.created_at)}
            </div>
          </div>
          <p class="profile-bio">${prof.biography || 'No biography available.'}</p>
        </div>
        <div class="profile-rating-box">
          <div class="rating-big">${avg.toFixed(1)}</div>
          <div class="rating-stars-big">${starsHTML(avg)}</div>
          <div class="rating-total">${cnt} review${cnt !== 1 ? 's' : ''}</div>
        </div>
      </div>

      <!-- Two-column layout -->
      <div class="profile-sections">
        <!-- LEFT: Subjects + Reviews -->
        <div>
          <div class="profile-card">
            <div class="profile-card-title">Student Reviews</div>
            <div id="reviews-list">
              ${cnt > 0 ? reviewsHTML : '<div class="empty" style="padding:20px 0"><div class="empty-icon">💬</div><div class="empty-text">No reviews yet. Be the first!</div></div>'}
            </div>
          </div>
        </div>

        <!-- RIGHT: Subjects + Write Review -->
        <div>
          <div class="profile-card">
            <div class="profile-card-title">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
              Subjects Taught
            </div>
            ${subjectListHTML || '<div class="text-muted" style="font-size:.875rem">No subjects assigned</div>'}
          </div>

          <div class="profile-card">
            <div class="profile-card-title">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              Write a Review
            </div>
            <div class="review-form">
  <div>
    <div class="form-label" style="margin-bottom:8px">Adınız *</div>
    <input class="form-input" id="review-name" placeholder="Ad Soyad" style="margin-bottom:8px" />
  </div>
  <div>
    <div class="form-label" style="margin-bottom:8px">Reytinq *</div>
    <div class="star-picker" id="star-picker">
      ${[1, 2, 3, 4, 5].map(n => `<button class="star-btn" data-val="${n}" onclick="pickStar(${n})">★</button>`).join('')}
    </div>
  </div>
  <div>
    <div class="form-label" style="margin-bottom:8px">Şərhiniz</div>
    <textarea class="review-input" id="review-comment" placeholder="Bu müəllim haqqında fikirlərinizi yazın…"></textarea>
  </div>
  <button class="submit-btn" id="submit-review-btn" onclick="submitReview(${prof.id})">Şərh Yaz</button>
</div>
              <div>
                <div class="form-label" style="margin-bottom:8px">Your Comment</div>
                <textarea class="review-input" id="review-comment" placeholder="Share your experience with this professor…"></textarea>
              </div>
              <button class="submit-btn" id="submit-review-btn" onclick="submitReview(${prof.id})">Submit Review</button>
            </div>
          </div>
        </div>
      </div>`;

        // Star picker state
        window._selectedRating = 0;
      }

      window.pickStar = function (n) {
        window._selectedRating = n;
        document.querySelectorAll('.star-btn').forEach(b => {
          b.classList.toggle('active', Number(b.dataset.val) <= n);
        });
      };

  window.submitReview = async function(profId) {
  const btn     = document.getElementById('submit-review-btn');
  const name    = document.getElementById('review-name').value.trim();
  const comment = document.getElementById('review-comment').value.trim();
  const rating  = window._selectedRating;

  if (!name)   { toast('Zəhmət olmasa adınızı yazın', 'error'); return; }
  if (!rating) { toast('Zəhmət olmasa reytinq seçin', 'error'); return; }

  btn.disabled = true;
  btn.textContent = 'Göndərilir…';

  try {
    const res = await api.postReview({ professor_id: profId, rating, comment, reviewer_name: name });
    toast('Şərhiniz göndərildi! Təşəkkür edirik.', 'success');

    const reviews = await api.getReviews(profId);
    document.getElementById('reviews-list').innerHTML = renderReviews(reviews);

    window._selectedRating = 0;
    document.querySelectorAll('.star-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('review-comment').value = '';
    document.getElementById('review-name').value = '';

    document.querySelector('.rating-big').textContent = Number(res.avg_rating).toFixed(1);
    document.querySelector('.rating-stars-big').textContent = starsHTML(res.avg_rating);
    document.querySelector('.rating-total').textContent = `${res.review_count} şərh`;
  } catch(e) {
    toast(e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Şərh Yaz';
  }


        function renderReviews(reviews) {
    if (!reviews.length) return '<div class="empty" style="padding:20px 0"><div class="empty-icon">💬</div><div class="empty-text">Hələ şərh yoxdur. İlk siz yazın!</div></div>';
    return reviews.map(r => `
      <div class="review-item">
        <div class="review-header">
          <span style="font-weight:600;font-size:.9rem">${r.reviewer_name || 'Anonim'}</span>
          <span class="review-date">${fmtDate(r.created_at)}</span>
        </div>
        <div class="review-header" style="margin-top:4px;margin-bottom:6px">
          <span class="review-stars">${starsHTML(r.rating)} <span style="color:var(--text-dim);font-size:.8rem;margin-left:4px">${r.rating}/5</span></span>
        </div>
        <div class="review-comment">${r.comment || '<em style="opacity:.5">Şərh yazılmayıb</em>'}</div>
      </div>`).join('');
  });
  
  </script>
</body>

</html>
