<script src="js/shared.js"></script>
<script>
(async function() {
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { location.href = 'search.html'; return; }

  try {
    const prof = await api.getProfessor(id);
    document.title = prof.full_name + ' — ProfRate';
    document.getElementById('bc-name').textContent = prof.full_name;
    renderProfile(prof);
  } catch(e) {
    document.getElementById('profile-loading').innerHTML =
      '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">' + e.message + '</div></div>';
  }

  function renderProfile(prof) {
    document.getElementById('profile-loading').classList.add('hidden');
    var content = document.getElementById('profile-content');
    content.classList.remove('hidden');

    var avg = Number(prof.avg_rating) || 0;
    var cnt = Number(prof.review_count) || 0;

    var subjectListHTML = '';
    if (prof.subjects && prof.subjects.length) {
      prof.subjects.forEach(function(s) {
        subjectListHTML += '<div class="subject-list-item" onclick="goToSubject(' + s.id + ')">' +
          '<div><div class="sname">' + s.subject_name + '</div><div class="sdept">' + s.department + '</div></div>' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>' +
          '</div>';
      });
    }

    var photoHTML = prof.photo_url
      ? '<img src="' + prof.photo_url + '" style="width:80px;height:80px;border-radius:18px;object-fit:cover;border:1px solid var(--border);margin-bottom:20px" onerror="this.style.display=\'none\'" />'
      : '<div class="profile-avatar">' + initials(prof.full_name) + '</div>';

    var metaExtra = '';
    if (prof.position) metaExtra += '<div class="profile-meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>' + prof.position + '</div>';
    if (prof.academic_degree) metaExtra += '<div class="profile-meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/></svg>' + prof.academic_degree + '</div>';
    if (prof.email) metaExtra += '<div class="profile-meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg><a href="mailto:' + prof.email + '" style="color:var(--gold)">' + prof.email + '</a></div>';

    content.innerHTML =
      '<div class="profile-hero">' +
        '<div>' +
          photoHTML +
          '<h1 class="profile-name">' + prof.full_name + '</h1>' +
          '<div class="profile-meta">' +
            '<div class="profile-meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>' + prof.university + '</div>' +
            '<div class="profile-meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="m8 21 4-4 4 4"/></svg>' + prof.faculty + '</div>' +
            metaExtra +
            '<div class="profile-meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>Əlavə edilib: ' + fmtDate(prof.created_at) + '</div>' +
          '</div>' +
          '<p class="profile-bio">' + (prof.biography || 'Bioqrafiya məlumatı yoxdur.') + '</p>' +
        '</div>' +
        '<div class="profile-rating-box">' +
          '<div class="rating-big">' + avg.toFixed(1) + '</div>' +
          '<div class="rating-stars-big">' + starsHTML(avg) + '</div>' +
          '<div class="rating-total">' + cnt + ' şərh</div>' +
        '</div>' +
      '</div>' +

      '<div class="profile-sections">' +
        '<div>' +
          '<div class="profile-card">' +
            '<div class="profile-card-title">Tələbə Şərhləri</div>' +
            '<div id="reviews-list">' + (cnt > 0 ? renderReviews(prof.reviews || []) : '<div class="empty" style="padding:20px 0"><div class="empty-icon">💬</div><div class="empty-text">Hələ şərh yoxdur. İlk siz yazın!</div></div>') + '</div>' +
          '</div>' +
        '</div>' +

        '<div>' +
          '<div class="profile-card">' +
            '<div class="profile-card-title">Tədris Etdiyi Fənlər</div>' +
            (subjectListHTML || '<div class="text-muted" style="font-size:.875rem">Fənn təyin edilməyib</div>') +
          '</div>' +

          '<div class="profile-card">' +
            '<div class="profile-card-title">Şərh Yaz</div>' +
            '<div class="review-form">' +
              '<div>' +
                '<div class="form-label" style="margin-bottom:8px">Adınız *</div>' +
                '<input class="form-input" id="review-name" placeholder="Ad Soyad" />' +
              '</div>' +
              '<div>' +
                '<div class="form-label" style="margin-bottom:8px">Reytinq *</div>' +
                '<div class="star-picker" id="star-picker">' +
                  '<button class="star-btn" data-val="1" onclick="pickStar(1)">★</button>' +
                  '<button class="star-btn" data-val="2" onclick="pickStar(2)">★</button>' +
                  '<button class="star-btn" data-val="3" onclick="pickStar(3)">★</button>' +
                  '<button class="star-btn" data-val="4" onclick="pickStar(4)">★</button>' +
                  '<button class="star-btn" data-val="5" onclick="pickStar(5)">★</button>' +
                '</div>' +
              '</div>' +
              '<div>' +
                '<div class="form-label" style="margin-bottom:8px">Şərhiniz</div>' +
                '<textarea class="review-input" id="review-comment" placeholder="Bu müəllim haqqında fikirlərinizi yazın…"></textarea>' +
              '</div>' +
              '<button class="submit-btn" id="submit-review-btn" onclick="submitReview(' + prof.id + ')">Şərh Yaz</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    window._selectedRating = 0;
  }

  window.pickStar = function(n) {
    window._selectedRating = n;
    document.querySelectorAll('.star-btn').forEach(function(b) {
      b.classList.toggle('active', Number(b.dataset.val) <= n);
    });
  };

  window.submitReview = async function(profId) {
    var btn     = document.getElementById('submit-review-btn');
    var name    = document.getElementById('review-name').value.trim();
    var comment = document.getElementById('review-comment').value.trim();
    var rating  = window._selectedRating;

    if (!name)   { toast('Zəhmət olmasa adınızı yazın', 'error'); return; }
    if (!rating) { toast('Zəhmət olmasa reytinq seçin', 'error'); return; }

    btn.disabled = true;
    btn.textContent = 'Göndərilir…';

    try {
      var res = await api.postReview({ professor_id: profId, rating: rating, comment: comment, reviewer_name: name });
      toast('Şərhiniz göndərildi! Təşəkkür edirik.', 'success');

      var reviews = await api.getReviews(profId);
      document.getElementById('reviews-list').innerHTML = renderReviews(reviews);

      window._selectedRating = 0;
      document.querySelectorAll('.star-btn').forEach(function(b) { b.classList.remove('active'); });
      document.getElementById('review-comment').value = '';
      document.getElementById('review-name').value = '';

      document.querySelector('.rating-big').textContent = Number(res.avg_rating).toFixed(1);
      document.querySelector('.rating-stars-big').textContent = starsHTML(res.avg_rating);
      document.querySelector('.rating-total').textContent = res.review_count + ' şərh';
    } catch(e) {
      toast(e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Şərh Yaz';
    }
  };

  function renderReviews(reviews) {
    if (!reviews.length) return '<div class="empty" style="padding:20px 0"><div class="empty-icon">💬</div><div class="empty-text">Hələ şərh yoxdur. İlk siz yazın!</div></div>';
    return reviews.map(function(r) {
      return '<div class="review-item">' +
        '<div class="review-header">' +
          '<span style="font-weight:600;font-size:.9rem">' + (r.reviewer_name || 'Anonim') + '</span>' +
          '<span class="review-date">' + fmtDate(r.created_at) + '</span>' +
        '</div>' +
        '<div class="review-header" style="margin-top:4px;margin-bottom:6px">' +
          '<span class="review-stars">' + starsHTML(r.rating) + ' <span style="color:var(--text-dim);font-size:.8rem;margin-left:4px">' + r.rating + '/5</span></span>' +
        '</div>' +
        '<div class="review-comment">' + (r.comment || '<em style="opacity:.5">Şərh yazılmayıb</em>') + '</div>' +
      '</div>';
    }).join('');
  }
})();
</script>
</body>
