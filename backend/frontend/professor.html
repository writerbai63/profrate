<script src="js/shared.js"></script>
<!-- Ortaq JavaScript funksiyalarını bağlayırıq -->

<script>
(async function() {
  // Səhifə açılarkən dərhal işə düşən funksiya

  const id = new URLSearchParams(location.search).get('id');
  // URL-dən professor ID-sini götürürük (məsələn: professor.html?id=3)

  if (!id) { location.href = 'search.html'; return; }
  // Əgər ID yoxdursa, axtarış səhifəsinə yönləndiririk

  try {
    const prof = await api.getProfessor(id);
    // Serverdən həmin ID-li professorun məlumatlarını gətiririk

    document.title = prof.full_name + ' — ProfRate';
    // Brauzer tabının başlığını professorun adı ilə dəyişirik

    document.getElementById('bc-name').textContent = prof.full_name;
    // Breadcrumb-da professorun adını göstəririk

    renderProfile(prof);
    // Professorun bütün məlumatlarını səhifəyə çəkirik
  } catch(e) {
    document.getElementById('profile-loading').innerHTML =
      '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">' + e.message + '</div></div>';
    // Xəta olarsa, xəta mesajı göstəririk
  }

  function renderProfile(prof) {
    document.getElementById('profile-loading').classList.add('hidden');
    // Yükləmə animasiyasını gizledirik

    var content = document.getElementById('profile-content');
    content.classList.remove('hidden');
    // Məzmun bölməsini görünən edirik

    var avg = Number(prof.avg_rating) || 0;
    // Ortalama reytinqi rəqəmə çeviririk, yoxdursa 0 qəbul edirik

    var cnt = Number(prof.review_count) || 0;
    // Şərh sayını rəqəmə çeviririk

    var subjectListHTML = '';
    if (prof.subjects && prof.subjects.length) {
      prof.subjects.forEach(function(s) {
        subjectListHTML += '<div class="subject-list-item" onclick="goToSubject(' + s.id + ')">' +
          '<div><div class="sname">' + s.subject_name + '</div><div class="sdept">' + s.department + '</div></div>' +
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>' +
          '</div>';
        // Hər fənn üçün kliklenebilir siyahı elementi yaradırıq
      });
    }
    // Professorun tədris etdiyi fənnlər siyahısını HTML-ə çeviririk

    var photoHTML = prof.photo_url
      ? '<img src="' + prof.photo_url + '" style="width:80px;height:80px;border-radius:18px;object-fit:cover;border:1px solid var(--border);margin-bottom:20px" onerror="this.style.display=\'none\'" />'
      : '<div class="profile-avatar">' + initials(prof.full_name) + '</div>';
    // Foto varsa şəkil göstəririk, yoxdursa baş hərflərdən ibarət avatar yaradırıq

    var metaExtra = '';
    if (prof.position) metaExtra += '<div class="profile-meta-item">...' + prof.position + '</div>';
    if (prof.academic_degree) metaExtra += '<div class="profile-meta-item">...' + prof.academic_degree + '</div>';
    if (prof.email) metaExtra += '<div class="profile-meta-item">...<a href="mailto:' + prof.email + '">' + prof.email + '</a></div>';
    // Əgər professor üçün vəzifə, elmi dərəcə və ya email varsa, bunları da göstəririk

    content.innerHTML =
      '<div class="profile-hero">' +
        '<div>' +
          photoHTML +
          // Professor şəkli və ya baş hərflər avatarı
          '<h1 class="profile-name">' + prof.full_name + '</h1>' +
          // Professorun tam adı böyük başlıq kimi
          '<div class="profile-meta">' +
            '<div class="profile-meta-item">...' + prof.university + '</div>' +
            // Universitet adı
            '<div class="profile-meta-item">...' + prof.faculty + '</div>' +
            // Fakültə adı
            metaExtra +
            // Vəzifə, elmi dərəcə, email (varsa)
            '<div class="profile-meta-item">...Əlavə edilib: ' + fmtDate(prof.created_at) + '</div>' +
            // Sistemə əlavə edilmə tarixi
          '</div>' +
          '<p class="profile-bio">' + (prof.biography || 'Bioqrafiya məlumatı yoxdur.') + '</p>' +
          // Professorun bioqrafiyası — yoxdursa standart mətn göstərilir
        '</div>' +
        '<div class="profile-rating-box">' +
          '<div class="rating-big">' + avg.toFixed(1) + '</div>' +
          // Böyük reytinq rəqəmi — məsələn: 4.7
          '<div class="rating-stars-big">' + starsHTML(avg) + '</div>' +
          // Ulduz şəklində reytinq
          '<div class="rating-total">' + cnt + ' şərh</div>' +
          // Ümumi şərh sayı
        '</div>' +
      '</div>' +

      '<div class="profile-sections">' +
        '<div>' +
          '<div class="profile-card">' +
            '<div class="profile-card-title">Tələbə Şərhləri</div>' +
            // Şərhlər bölməsinin başlığı
            '<div id="reviews-list">' + (cnt > 0 ? renderReviews(prof.reviews || []) : '<div class="empty">...İlk siz yazın!</div>') + '</div>' +
            // Şərhlər varsa göstərir, yoxdursa "ilk siz yazın" mesajı
          '</div>' +
        '</div>' +

        '<div>' +
          '<div class="profile-card">' +
            '<div class="profile-card-title">Tədris Etdiyi Fənlər</div>' +
            (subjectListHTML || '<div class="text-muted">Fənn təyin edilməyib</div>') +
            // Fənnlər varsa göstərir, yoxdursa "təyin edilməyib" yazır
          '</div>' +

          '<div class="profile-card">' +
            '<div class="profile-card-title">Şərh Yaz</div>' +
            '<div class="review-form">' +
              // Şərh yazma formu
              '<div><div class="form-label">Adınız *</div>' +
              '<input class="form-input" id="review-name" placeholder="Ad Soyad" /></div>' +
              // Ad sahəsi — mütləq doldurulmalıdır

              '<div><div class="form-label">Reytinq *</div>' +
              '<div class="star-picker" id="star-picker">' +
                '<button class="star-btn" data-val="1" onclick="pickStar(1)">★</button>' +
                '<button class="star-btn" data-val="2" onclick="pickStar(2)">★</button>' +
                '<button class="star-btn" data-val="3" onclick="pickStar(3)">★</button>' +
                '<button class="star-btn" data-val="4" onclick="pickStar(4)">★</button>' +
                '<button class="star-btn" data-val="5" onclick="pickStar(5)">★</button>' +
              '</div></div>' +
              // 1-dən 5-ə qədər ulduz seçimi — hər ulduz bir düymədir

              '<div><div class="form-label">Şərhiniz</div>' +
              '<textarea class="review-input" id="review-comment" placeholder="Bu müəllim haqqında fikirlərinizi yazın…"></textarea></div>' +
              // Şərh mətni üçün çox sətirli sahə

              '<button class="submit-btn" id="submit-review-btn" onclick="submitReview(' + prof.id + ')">Şərh Yaz</button>' +
              // Göndər düyməsi — klik edəndə submitReview() işə düşür
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    window._selectedRating = 0;
    // Seçilmiş reytinqi sıfırlayırıq
  }

  window.pickStar = function(n) {
    window._selectedRating = n;
    // Seçilmiş ulduz sayını yadda saxlayırıq

    document.querySelectorAll('.star-btn').forEach(function(b) {
      b.classList.toggle('active', Number(b.dataset.val) <= n);
      // Seçilmiş ulduza qədər olanları "active" edirik ki, sarı rəng alsın
    });
  };

  window.submitReview = async function(profId) {
    var btn     = document.getElementById('submit-review-btn');
    var name    = document.getElementById('review-name').value.trim();
    var comment = document.getElementById('review-comment').value.trim();
    var rating  = window._selectedRating;
    // Formdakı bütün məlumatları oxuyuruq

    if (!name)   { toast('Zəhmət olmasa adınızı yazın', 'error'); return; }
    if (!rating) { toast('Zəhmət olmasa reytinq seçin', 'error'); return; }
    // Məcburi sahələr boşdursa, xəta bildirişi göstəririk

    btn.disabled = true;
    btn.textContent = 'Göndərilir…';
    // Düyməni deaktiv edirik ki, iki dəfə basılmasın

    try {
      var res = await api.postReview({ professor_id: profId, rating: rating, comment: comment, reviewer_name: name });
      // Şərhi serverə göndəririk

      toast('Şərhiniz göndərildi! Təşəkkür edirik.', 'success');
      // Uğurlu olduqda yaşıl bildiriş göstəririk

      var reviews = await api.getReviews(profId);
      document.getElementById('reviews-list').innerHTML = renderReviews(reviews);
      // Yeni şərhlər siyahısını yeniləyirik

      window._selectedRating = 0;
      document.querySelectorAll('.star-btn').forEach(function(b) { b.classList.remove('active'); });
      document.getElementById('review-comment').value = '';
      document.getElementById('review-name').value = '';
      // Formu sıfırlayırıq

      document.querySelector('.rating-big').textContent = Number(res.avg_rating).toFixed(1);
      document.querySelector('.rating-stars-big').textContent = starsHTML(res.avg_rating);
      document.querySelector('.rating-total').textContent = res.review_count + ' şərh';
      // Reytinq qutusu yeni ortalama ilə yenilənir
    } catch(e) {
      toast(e.message, 'error');
      // Xəta olarsa bildiriş göstəririk
    } finally {
      btn.disabled = false;
      btn.textContent = 'Şərh Yaz';
      // Xəta olsa da olmasa da düyməni yenidən aktiv edirik
    }
  };

  function renderReviews(reviews) {
    if (!reviews.length) return '<div class="empty">...Hələ şərh yoxdur. İlk siz yazın!</div>';
    // Şərh yoxdursa boş vəziyyət mesajı göstəririk

    return reviews.map(function(r) {
      return '<div class="review-item">' +
        '<div class="review-header">' +
          '<span>' + (r.reviewer_name || 'Anonim') + '</span>' +
          // Şərh yazanın adı — yoxdursa "Anonim" göstərilir
          '<span class="review-date">' + fmtDate(r.created_at) + '</span>' +
          // Şərhin yazılma tarixi
        '</div>' +
        '<div class="review-header">' +
          '<span class="review-stars">' + starsHTML(r.rating) + ' ' + r.rating + '/5</span>' +
          // Ulduz reytinqi və rəqəmsal bal
        '</div>' +
        '<div class="review-comment">' + (r.comment || '<em>Şərh yazılmayıb</em>') + '</div>' +
        // Şərh mətni — yoxdursa "yazılmayıb" göstərilir
      '</div>';
    }).join('');
    // Bütün şərhləri HTML-ə çevirib birləşdiririk
  }
})();
</script>
