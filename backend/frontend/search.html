<main class="page results-page">
  <div class="container">

    <!-- Search bar row -->
    <div class="search-wrap" style="max-width:100%;margin-bottom:40px">
    <!-- Axtarış qutusu — tam eni tutur -->
      <div class="search-bar" id="results-search-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <!-- Böyüdücü şüşə ikonu -->
        <input id="results-input" type="text" placeholder="Search professors, subjects…" autocomplete="off" />
        <!-- Axtarış sahəsi -->
        <button class="search-btn" id="results-btn">Search</button>
        <!-- Axtarış düyməsi -->
      </div>
    </div>

    <div id="results-header" class="results-header hidden"></div>
    <!-- Axtarış nəticəsinin başlığı — məsələn: '5 professor tapıldı' — əvvəlcə gizlidir -->

    <!-- ALL professors list (default view) -->
    <!-- Axtarış olmadıqda bütün professorlar burada göstərilir -->
    <div id="all-view">
      <div class="section-header" style="margin-bottom:24px">
        <h2 class="section-title">All <span>Professors</span></h2>
        <span id="all-count" class="text-muted" style="font-size:.85rem"></span>
        <!-- Ümumi professor sayı buraya yazılır -->
      </div>
      <div class="cards-grid" id="all-grid">
        <div class="loading"><div class="spinner"></div><span>Loading…</span></div>
        <!-- Professorlar yüklənənə qədər animasiya göstərilir -->
      </div>
    </div>

    <!-- Search results view -->
    <!-- Axtarış edildikdə bu bölmə aktivləşir, yuxarıdakı gizlənir -->
    <div id="search-view" class="hidden">
      <div class="results-tabs">
      <!-- Professor və Fənn nəticələri arasında keçid tabları -->
        <button class="tab-btn active" onclick="switchTab('professors')">Professors <span id="tab-prof-count"></span></button>
        <!-- Professor tabı — neçə nəticə tapıldığı da göstərilir -->
        <button class="tab-btn" onclick="switchTab('subjects')">Subjects <span id="tab-sub-count"></span></button>
        <!-- Fənn tabı -->
      </div>

      <div id="tab-professors" class="tab-panel active">
        <div class="cards-grid" id="search-prof-grid"></div>
        <!-- Professor axtarış nəticələri buraya JavaScript ilə doldurulur -->
      </div>

      <div id="tab-subjects" class="tab-panel">
        <div class="cards-grid" id="search-sub-grid"></div>
        <!-- Fənn axtarış nəticələri buraya JavaScript ilə doldurulur -->
      </div>
    </div>

  </div>
</main>

<footer>
  <div class="container"><p>Built with ❤️ for students · <strong>ProfRate</strong></p></div>
</footer>

<script src="js/shared.js"></script>
<!-- Ortaq JavaScript funksiyalarını bağlayırıq -->

<script>
let activeTab = 'professors';
// Hazırda aktiv olan tabı yadda saxlayırıq

function switchTab(name) {
  activeTab = name;
  // Aktiv tabı yeniləyirik

  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', (i === 0 && name === 'professors') || (i === 1 && name === 'subjects'));
    // Hansı tab düyməsinin aktiv görünəcəyini müəyyən edirik
  });
  document.getElementById('tab-professors').classList.toggle('active', name === 'professors');
  document.getElementById('tab-subjects').classList.toggle('active', name === 'subjects');
  // Seçilmiş tab panelini görünən, digərini gizlənmiş edirik
}

function subjectCardHTML(s) {
// Hər fənn üçün kart HTML-i yaradan funksiya
  return `
    <div class="prof-card" onclick="goToSubject(${s.id})">
    <!-- Karta klik edəndə həmin fənnin səhifəsinə keçir -->
      <div class="card-avatar" style="background:var(--accent-dim);color:var(--accent)">📚</div>
      <!-- Fənn üçün kitab ikonu avatar kimi -->
      <div class="card-name">${s.subject_name}</div>
      <!-- Fənnin adı -->
      <div class="card-dept">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="m8 21 4-4 4 4"/></svg>
        ${s.department}
        <!-- Kafedra adı ikonu ilə birlikdə -->
      </div>
      <div class="card-rating">
        <span class="text-dim" style="font-size:.85rem">${s.professor_count} professor${s.professor_count !== 1 ? 's' : ''} teach this subject</span>
        <!-- Bu fənni neçə professorun tədris etdiyi -->
      </div>
    </div>`;
}

async function runSearch(q) {
// Axtarış sorğusunu icra edən funksiya
  document.getElementById('all-view').classList.add('hidden');
  document.getElementById('search-view').classList.remove('hidden');
  // Bütün professorlar görünümünü gizlədib axtarış nəticələrini görünən edirik

  const header   = document.getElementById('results-header');
  header.classList.remove('hidden');

  const profGrid = document.getElementById('search-prof-grid');
  const subGrid  = document.getElementById('search-sub-grid');

  header.innerHTML = `<div class="results-query">Results for <em>"${q}"</em></div>`;
  // Axtarış sözünü başlıqda göstəririk

  profGrid.innerHTML = subGrid.innerHTML = '<div class="loading"><div class="spinner"></div><span>Searching…</span></div>';
  // Axtarış gedərkən hər iki gridə yükləmə animasiyası qoyuruq

  try {
    const { professors, subjects, profsBySubject } = await api.search(q);
    // Serverdən axtarış nəticələrini gətiririk

    const seen = new Set();
    const allProfs = [...professors, ...profsBySubject].filter(p => {
      if (seen.has(p.id)) return false;
      seen.add(p.id); return true;
    });
    // Birbaşa ad uyğunluğu + fənn üzrə tapılanları birləşdiririk
    // Set() istifadə edərək eyni professoru iki dəfə göstərmirik

    document.getElementById('tab-prof-count').textContent = allProfs.length ? `(${allProfs.length})` : '';
    document.getElementById('tab-sub-count').textContent  = subjects.length ? `(${subjects.length})` : '';
    // Tab düymələrinin yanına tapılan say yazırıq

    header.innerHTML += `<div class="results-meta">${allProfs.length} professor${allProfs.length !== 1 ? 's' : ''} · ${subjects.length} subject${subjects.length !== 1 ? 's' : ''} found</div>`;
    // Başlığa ümumi nəticə sayı məlumatı əlavə edirik

    profGrid.innerHTML = allProfs.length
      ? allProfs.map(profCardHTML).join('')
      : '<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">No professors found</div></div>';
    // Professor tapıldısa kartları göstərir, tapılmadısa "tapılmadı" mesajı

    subGrid.innerHTML = subjects.length
      ? subjects.map(subjectCardHTML).join('')
      : '<div class="empty"><div class="empty-icon">📚</div><div class="empty-text">No subjects found</div></div>';
    // Fənn tapıldısa kartları göstərir, tapılmadısa "tapılmadı" mesajı

  } catch(e) {
    profGrid.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">${e.message}</div></div>`;
    // Server xətası olarsa xəta mesajı göstəririk
  }
}

async function loadAll() {
// Bütün professorları yükləyən funksiya — axtarış olmadıqda işə düşür
  try {
    const profs = await api.getProfessors();
    // Serverdən bütün professorları gətiririk

    document.getElementById('all-count').textContent = `${profs.length} professors`;
    // Ümumi professor sayını başlığın yanına yazırıq

    document.getElementById('all-grid').innerHTML = profs.length
      ? profs.map(profCardHTML).join('')
      : '<div class="empty"><div class="empty-icon">🎓</div><div class="empty-text">No professors yet. Add some in Admin!</div></div>';
    // Professor varsa kartları göstərir, yoxdursa "hələ yoxdur" mesajı
  } catch(e) {
    document.getElementById('all-grid').innerHTML =
      '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">Could not connect to API server.</div></div>';
    // Server ilə əlaqə qurulmazsa xəta mesajı
  }
}

// Init — Səhifə açılarkən işə düşən hissə
(function() {
  const params = new URLSearchParams(location.search);
  const q = params.get('q') || '';
  // URL-dən axtarış sözünü götürürük — məsələn: search.html?q=huseyn

  const input = document.getElementById('results-input');
  const btn   = document.getElementById('results-btn');

  input.value = q;
  // Axtarış sahəsinə URL-dəki sözü yazırıq

  if (q) {
    runSearch(q);
    // URL-də axtarış sözü varsa dərhal axtarış edirik
  } else {
    loadAll();
    // Yoxdursa bütün professorları yükləyirik
  }

  btn.addEventListener('click', () => {
    const val = input.value.trim();
    if (val) {
      history.replaceState({}, '', `?q=${encodeURIComponent(val)}`);
      runSearch(val);
      // Axtarış sözünü URL-ə yazıb axtarış edirik
    } else {
      history.replaceState({}, '', '?');
      document.getElementById('search-view').classList.add('hidden');
      document.getElementById('all-view').classList.remove('hidden');
      document.getElementById('results-header').classList.add('hidden');
      loadAll();
      // Axtarış sahəsi boşdursa bütün professorlar görünümünə qayıdırıq
    }
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') btn.click();
    // Enter düyməsinə basılanda da axtarış işə düşür
  });
})();
</script>
