<main class="page profile-page">

<footer>
  <div class="container"><p>Built with ❤️ for students · <strong>ProfRate</strong></p></div>
</footer>

<script src="js/shared.js"></script>
<script>
(async function() {
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { location.href = 'search.html'; return; }

  try {
    const subject = await api.getSubject(id);
    document.title = `${subject.subject_name} — ProfRate`;
    document.getElementById('bc-name').textContent = subject.subject_name;
    renderSubject(subject);
  } catch(e) {
    document.getElementById('subject-loading').innerHTML =
      `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">${e.message}</div></div>`;
  }

  function renderSubject(subject) {
    document.getElementById('subject-loading').classList.add('hidden');
    const content = document.getElementById('subject-content');
    content.classList.remove('hidden');

    const profs = subject.professors || [];
    const avgRatings = profs.filter(p => p.review_count > 0).map(p => Number(p.avg_rating));
    const overallAvg = avgRatings.length
      ? (avgRatings.reduce((a,b) => a+b, 0) / avgRatings.length).toFixed(1)
      : 'N/A';

    content.innerHTML = `
      <!-- Subject Hero -->
      <div class="subject-hero">
        <div class="subject-icon">📚</div>
        <h1 class="subject-name">${subject.subject_name}</h1>
        <div style="display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap">
          <span class="subject-dept-badge">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/></svg>
            ${subject.department}
          </span>
          <span class="text-dim" style="font-size:.875rem">${profs.length} professor${profs.length !== 1 ? 's' : ''} teaching this subject</span>
          ${avgRatings.length ? `
            <span style="display:flex;align-items:center;gap:6px">
              <span class="stars" style="font-size:.9rem">${starsHTML(Math.round(overallAvg))}</span>
              <span class="text-dim" style="font-size:.875rem">${overallAvg} avg rating</span>
            </span>` : ''}
        </div>
      </div>

      <!-- Professors teaching this subject -->
      <div class="section-header" style="margin-bottom:24px">
        <h2 class="section-title">Professors Teaching <span>${subject.subject_name}</span></h2>
      </div>

      ${profs.length
        ? `<div class="cards-grid">${profs.map(profCardHTML).join('')}</div>`
        : `<div class="empty"><div class="empty-icon">🎓</div><div class="empty-text">No professors assigned to this subject yet.</div></div>`
      }`;
  }
})();
</script>
